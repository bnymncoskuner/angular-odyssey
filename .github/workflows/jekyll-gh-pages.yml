name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build v4-v9 (Angular 9, Node 12)
      - uses: actions/setup-node@v4
        with:
          node-version: "12"
      - name: Build v4-v9
        run: |
          cd v4-v9
          npm install --legacy-peer-deps
          npm run build:prod

      # Build v10-v13 (Angular 13, Node 18)
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Build v10-v13
        run: |
          cd v10-v13
          npm install --legacy-peer-deps
          npm run build:prod

      # Build v14-v16 (Angular 16, Node 18)
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Build v14-v16
        run: |
          cd v14-v16
          npm install --legacy-peer-deps
          npm run build:prod

      # Build v17-v19 (Angular 19, Node 20)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build v17-v19
        run: |
          cd v17-v19
          npm ci
          npm run build:prod

      # Build v20-v21 (Angular 21, Node 22)
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - name: Build v20-v21
        run: |
          cd v20-v21
          npm ci
          npm run build:prod

      # Build v22 (Angular 22, Node 22)
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - name: Build v22
        run: |
          cd v22
          npm ci
          npm run build:prod

      # Assemble the final site
      - name: Assemble site
        run: |
          mkdir -p _site

          # Copy slides as the root
          cp -r slides/* _site/

          # Update iframe URLs in slides to use relative paths
          sed -i 's|http://localhost:4200|./v4-v9/|g' _site/index.html
          sed -i 's|http://localhost:4201|./v10-v13/|g' _site/index.html
          sed -i 's|http://localhost:4202|./v14-v16/|g' _site/index.html
          sed -i 's|http://localhost:4203|./v17-v19/|g' _site/index.html
          sed -i 's|http://localhost:4204|./v20-v21/|g' _site/index.html
          sed -i 's|http://localhost:4205|./v22/|g' _site/index.html

          # Copy built Angular apps
          mkdir -p _site/v4-v9 _site/v10-v13 _site/v14-v16 _site/v17-v19 _site/v20-v21 _site/v22

          cp -r v4-v9/dist/v4-v9/* _site/v4-v9/ 2>/dev/null || cp -r v4-v9/dist/* _site/v4-v9/
          cp -r v10-v13/dist/v10-v13/* _site/v10-v13/ 2>/dev/null || cp -r v10-v13/dist/* _site/v10-v13/
          cp -r v14-v16/dist/v14-v16/* _site/v14-v16/ 2>/dev/null || cp -r v14-v16/dist/* _site/v14-v16/
          cp -r v17-v19/dist/v17-v19/browser/* _site/v17-v19/ 2>/dev/null || cp -r v17-v19/dist/v17-v19/* _site/v17-v19/ 2>/dev/null || cp -r v17-v19/dist/* _site/v17-v19/
          cp -r v20-v21/dist/v20-v21/browser/* _site/v20-v21/ 2>/dev/null || cp -r v20-v21/dist/v20-v21/* _site/v20-v21/ 2>/dev/null || cp -r v20-v21/dist/* _site/v20-v21/
          cp -r v22/dist/v22/browser/* _site/v22/ 2>/dev/null || cp -r v22/dist/v22/* _site/v22/ 2>/dev/null || cp -r v22/dist/* _site/v22/

          # Add .nojekyll to prevent GitHub Pages from ignoring _files
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
